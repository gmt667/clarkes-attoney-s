<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      try {
        const saved = localStorage.getItem('clarkes-theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { /* Default to readable light theme when storage is unavailable. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Clarkes Attorneys: please enable JavaScript to browse this website. For assistance, email <a href="mailto:info@clarkesattorneys.mw">info@clarkesattorneys.mw</a> or call <a href="tel:+265881618041">+265 881 618 041</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
